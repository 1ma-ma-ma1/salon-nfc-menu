<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽選デモ</title><link rel="stylesheet" href="../style.css"></head><body><main><a class="back" href="./">← 抽選方法を選ぶ</a><div class="spark">✦</div><h1 id="heading">抽選</h1><p class="sub">スタートボタンを押してください</p><div id="result" class="result" aria-live="polite">準備完了</div><button id="start" class="start">スタート</button><p class="note">デモ用の結果をランダムに表示します。公平な景品抽選、参加回数制限、当選履歴保存の機能はありません。口コミ投稿を抽選参加の条件にしないでください。</p></main><script src="../config.js"></script><script>
'use strict';const type=new URLSearchParams(location.search).get('type');const item=window.NFC_CONFIG.lottery.find(x=>x.type===type&&x.enabled);if(!item){document.getElementById('heading').textContent='抽選方法が見つかりません';document.getElementById('start').disabled=true;}else{document.getElementById('heading').textContent=item.label;}document.getElementById('start').addEventListener('click',()=>{const values=window.NFC_CONFIG.demoResults;if(!Array.isArray(values)||!values.length){document.getElementById('result').textContent='結果が未設定です';return;}const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);document.getElementById('result').textContent=values[bytes[0]%values.length];document.getElementById('start').disabled=true;document.getElementById('start').textContent='抽選終了';});
</script></body></html>
