<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root{color-scheme:light;--bg:#f7f6f0;--paper:#fffefa;--ink:#34483d;--muted:#778075;--green:#526657;--line:#d6ddcf;--gold:#b08d50;--serif:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;--sans:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 0% 0%,#eaf0e4,transparent 55%),radial-gradient(ellipse at 100% 100%,#f2e9d8,transparent 60%),var(--bg);color:var(--ink);font:14px/1.8 var(--sans)}
    main{width:min(100%,680px);margin:0 auto;padding:25px 19px 60px}.back{display:inline-flex;align-items:center;min-height:44px;color:var(--green);font-size:12px;text-underline-offset:3px}.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:15px;font-size:12px;color:var(--muted)}.brand img{width:30px;height:30px}
    .eyebrow{text-align:center;color:var(--gold);font-size:10px;letter-spacing:.22em;margin:27px 0 4px}h1{font:500 clamp(29px,7vw,40px)/1.5 var(--serif);text-align:center;letter-spacing:.06em;margin:0 0 7px}.lead{text-align:center;color:var(--muted);font-size:13px;margin:0 0 25px}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}nav a{display:flex;flex-direction:column;justify-content:center;min-height:143px;padding:19px;border-radius:19px;border:1px solid var(--line);background:var(--paper);box-shadow:0 12px 28px #34483d10;color:var(--ink);text-decoration:none;transition:transform .2s,border-color .2s}nav a:hover{transform:translateY(-3px);border-color:var(--gold)}nav a:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.num{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.14em}nav strong{font:500 clamp(16px,4.5vw,22px)/1.6 var(--serif);margin:5px 0}nav small{font-size:11px;color:var(--muted)}.note{text-align:center;font-size:11px;color:var(--muted);margin:25px auto;max-width:470px}
    @media(max-width:420px){nav{grid-template-columns:1fr;gap:10px}nav a{min-height:102px;padding:15px 18px}}@media(prefers-reduced-motion:reduce){nav a{transition:none}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← サービスのご案内へ戻る</a>
    <div class="brand"><img src="https://1ma-ma-ma1.github.io/amida/leaf.svg" alt="">リラクゼーションサロン</div>
    <p class="eyebrow">A LITTLE GIFT FOR YOU</p>
    <h1>お好きな抽選を<br>お選びください</h1>
    <p class="lead">このブラウザで、4種類から選んだ1種類を1回だけ抽選できます。</p>
    <nav aria-label="抽選方法">
      <a href="https://1ma-ma-ma1.github.io/amida/?v=single20261120"><span class="num">01</span><strong>癒やしのあみだくじ</strong><small>キャラクターと線をたどる</small></a>
      <a href="https://1ma-ma-ma1.github.io/amida/roulette/?v=single20261120"><span class="num">02</span><strong>ご褒美ルーレット</strong><small>回転とお祝いの演出</small></a>
      <a href="https://1ma-ma-ma1.github.io/amida/kuji/?v=single20261120"><span class="num">03</span><strong>ご褒美くじ引き</strong><small>好きなくじを選んで開く</small></a>
      <a href="https://1ma-ma-ma1.github.io/amida/egg/?v=single20261120"><span class="num">04</span><strong>たまごのご褒美くじ</strong><small>たまごを選んで殻を開く</small></a>
    </nav>
    <p class="note">抽選結果と受付番号を保存します。結果画面をスタッフにお見せください。</p>
  </main>
</body>
</html>
