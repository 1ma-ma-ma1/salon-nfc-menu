<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>抽選APIの接続確認</title><h1>抽選APIの接続確認</h1><button id="health">記録せずに接続確認</button><pre id="status" role="status">未確認</pre><script>
document.querySelector('#health').onclick=async()=>{const s=document.querySelector('#status');s.textContent='確認中';try{const r=await fetch('https://script.google.com/macros/s/AKfycbzYsk-IEGAhZC6UyCWJzD-M6z151uSnfevvK3tLltwV-iox81KMqbh_E7v7B69Wa7sX9w/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'health'}),credentials:'omit',redirect:'follow'});s.textContent=JSON.stringify(await r.json(),null,2);}catch(e){s.textContent='通信失敗: '+e.message;}};
</script></html>
