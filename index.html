<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f1"><title>サービスのご案内</title><link rel="stylesheet" href="style.css"></head><body><main><div class="spark">✦</div><h1 id="title">サービスのご案内</h1><p class="sub">ご利用になるサービスをお選びください</p><div class="links" id="links"></div><p class="note">外部サービスへ移動する場合があります。</p><footer>サービス案内</footer></main><script src="config.js?v=20261119-four-games"></script><script>
'use strict';
const cfg=window.NFC_CONFIG;
document.getElementById('title').textContent=cfg.title;
const box=document.getElementById('links');
for(const item of cfg.links){if(!item.enabled)continue;const a=document.createElement('a');a.className='link';a.textContent=item.label+' ↗';if(item.url){a.href=item.url;}else{a.removeAttribute('href');a.style.opacity='.5';a.setAttribute('aria-disabled','true');const s=document.createElement('small');s.textContent='準備中';a.append(s);}box.append(a);}
</script></body></html>
